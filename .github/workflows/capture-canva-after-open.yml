name: Test Laith Anwar Invitation

on:
  push:
    branches:
      - laith-anwar-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laith-anwar-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run invitation browser test
        run: |
          python3 -m http.server 4173 --directory laith-anwar >/tmp/invitation-server.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('#openInvitation').click();
            await page.waitForTimeout(700);

            if (!(await page.locator('#invitation').evaluate(el => el.classList.contains('visible')))) {
              throw new Error('Invitation did not become visible after opening.');
            }
            if (await page.locator('#cover').evaluate(el => !el.classList.contains('is-open'))) {
              throw new Error('Cover did not transition to open state.');
            }
            const text = await page.locator('body').innerText();
            for (const required of ['٢٦ سبتمبر ٢٠٢٦','صالة الشرق للاحتفالات','حضوركم يُهمّنا']) {
              if (!text.includes(required)) throw new Error(`Missing required invitation text: ${required}`);
            }
            await page.locator('#rsvpButton').scrollIntoViewIfNeeded();
            await page.locator('#rsvpButton').click();
            await page.waitForTimeout(200);
            if (!(await page.locator('#toast').evaluate(el => el.classList.contains('show')))) {
              throw new Error('RSVP interaction did not show confirmation note.');
            }
            if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));

            console.log('Invitation browser test passed.');
            await browser.close();
          })();
          NODE
